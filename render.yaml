services:
  - type: web
    name: ntandomods-ads
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SITE_NAME
        value: Ntandomods Ads
    # Free plan does not support persistent disks. Data is stored on local
    # disk and will be wiped on redeploy. To persist data permanently,
    # upgrade to a paid plan and uncomment the block below, plus set
    # DATA_DIR=/data/db and UPLOAD_DIR=/data/uploads as env vars.
    # disk:
    #   name: ads-data
    #   mountPath: /data
    #   sizeGB: 1
