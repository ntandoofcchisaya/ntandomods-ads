services:
  - type: web
    name: ntandomods-ads
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SITE_NAME
        value: Ntandomods Ads
      - key: DATA_DIR
        value: /data/db
      - key: UPLOAD_DIR
        value: /data/uploads
    disk:
      name: ads-data
      mountPath: /data
      sizeGB: 1
